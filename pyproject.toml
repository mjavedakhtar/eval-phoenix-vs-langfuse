[project]
name = "eval-phoenix-vs-langfuse"
version = "0.1.0"
description = "Same diagnostic agent, same golden questions, Phoenix vs Langfuse."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-ollama>=0.2.0",
  "langgraph>=0.2.0",
  "langfuse>=2.0.0",
  "openinference-instrumentation-langchain>=0.1.0",
  "arize-phoenix>=11.0.0",
  "arize-phoenix-otel>=0.8.0",
  "arize-phoenix-evals>=0.17.0",
  "opentelemetry-sdk>=1.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "fastmcp>=2.0.0",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.1.0"]

[tool.uv]
package = false
